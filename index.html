<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create && Upload Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .input-field {
            background-color: #010409; border: 1px solid #30363d; color: white;
        }
        .input-field:focus { border-color: #58a6ff; outline: none; }
        .btn-primary {
            background-color: #238636; color: white; transition: 0.2s;
        }
        .btn-primary:hover { background-color: #2ea043; }
        .btn-disabled { background-color: #30363d; cursor: not-allowed; opacity: 0.6; }
        
        #logs::-webkit-scrollbar { width: 8px; }
        #logs::-webkit-scrollbar-track { background: #010409; }
        #logs::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-[#161b22] p-6 rounded-xl border border-[#30363d] shadow-xl">
        <h1 class="text-2xl font-bold mb-1 text-white">GitHub Uploader</h1>
        <p class="text-sm text-gray-400 mb-6">Auto create repository & upload extracted ZIP.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold mb-1 text-gray-300">GitHub Username</label>
                <input type="text" id="username" class="w-full p-2 rounded input-field" placeholder="Contoh: Lyntharx">
            </div>

            <div>
                <label class="block text-xs font-bold mb-1 text-gray-300">Personal Access Token</label>
                <input type="password" id="token" class="w-full p-2 rounded input-field" placeholder="ghp_xxxxxxxxxxxx">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-300">Nama Repository</label>
                    <input type="text" id="repoName" class="w-full p-2 rounded input-field" placeholder="my-project">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-300">Visibilitas</label>
                    <select id="visibility" class="w-full p-2 rounded input-field cursor-pointer">
                        <option value="public">Public (Terbuka)</option>
                        <option value="private">Private (Pribadi)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold mb-1 text-gray-300">File ZIP Project</label>
                <input type="file" id="zipFile" accept=".zip" class="w-full p-2 rounded input-field file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#30363d] file:text-white hover:file:bg-[#21262d]">
            </div>

            <button id="btnUpload" onclick="startProcess()" class="w-full py-3 rounded font-bold btn-primary mt-4">
                Mulai Upload
            </button>
        </div>

        <div class="mt-6">
            <label class="block text-xs font-bold mb-2 text-gray-400">Status Log:</label>
            <div id="logs" class="h-40 overflow-y-auto bg-[#010409] p-3 rounded border border-[#30363d] text-xs font-mono space-y-1">
                <div class="text-gray-500">waiting for input...</div>
            </div>
        </div>
    </div>

    <script>
        const logArea = document.getElementById('logs');
        
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString();
            if (type === 'error') div.className = 'text-red-400';
            else if (type === 'success') div.className = 'text-green-400';
            else div.className = 'text-blue-300';
            
            div.innerText = `[${timestamp}] ${msg}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        async function startProcess() {
            const username = document.getElementById('username').value.trim();
            const token = document.getElementById('token').value.trim();
            const repoName = document.getElementById('repoName').value.trim();
            const visibility = document.getElementById('visibility').value; // Ambil nilai dropdown
            const fileInput = document.getElementById('zipFile').files[0];
            const btn = document.getElementById('btnUpload');

            if (!username || !token || !repoName || !fileInput) {
                addLog("Mohon lengkapi semua kolom!", 'error');
                return;
            }

            // Tentukan boolean private berdasarkan dropdown
            const isPrivate = visibility === 'private';

            btn.disabled = true;
            btn.classList.add('btn-disabled');
            logArea.innerHTML = ''; 
            addLog(`Memulai proses (${visibility} repository)...`, 'info');

            try {
                // 1. Buat Repository dengan status Private/Public
                addLog(`Membuat repository '${repoName}'...`);
                const repoCreated = await createRepository(username, token, repoName, isPrivate);
                
                if (!repoCreated) throw new Error("Gagal membuat repository.");
                addLog("Repository berhasil dibuat!", 'success');

                // 2. Baca ZIP
                addLog("Membaca file ZIP...");
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(fileInput);
                
                // 3. Upload Files
                const files = Object.keys(zipContent.files);
                addLog(`Ditemukan ${files.length} item dalam ZIP.`);
                
                let count = 0;
                for (const filename of files) {
                    const fileData = zipContent.files[filename];
                    if (fileData.dir) continue; // Skip folder kosong

                    addLog(`Mengupload: ${filename}...`);
                    const contentBlob = await fileData.async("blob");
                    const base64Content = await blobToBase64(contentBlob);
                    
                    await uploadToGithub(username, token, repoName, filename, base64Content);
                    count++;
                }

                addLog(`Selesai! ${count} file berhasil diupload.`, 'success');
                addLog(`Cek repo: https://github.com/${username}/${repoName}`, 'success');
                alert("Upload Berhasil!");

            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.classList.remove('btn-disabled');
            }
        }

        // Fungsi Create Repo Diupdate untuk menerima parameter isPrivate
        async function createRepository(user, token, repoName, isPrivate) {
            const response = await fetch('https://api.github.com/user/repos', {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    name: repoName,
                    private: isPrivate, // Set True/False sesuai pilihan user
                    auto_init: true 
                })
            });

            if (response.status === 201) return true;
            const err = await response.json();
            throw new Error(`API Error: ${err.message}`);
        }

        async function uploadToGithub(user, token, repo, path, content) {
            const cleanContent = content.split(',')[1];
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
            
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: `Add ${path} via Allxd Uploader`,
                    content: cleanContent,
                    encoding: 'base64'
                })
            });

            if (!response.ok) {
                console.error(`Gagal upload ${path}:`, await response.json());
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve, _) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }
    </script>
</body>
</html>
